server {
    listen 80;
    listen [::]:80;
    server_name badges.faithgram.xyz;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/faithgram-acme;
        default_type text/plain;
    }
    location / {
        return 301 https://badges.faithgram.xyz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name badges.faithgram.xyz;

    ssl_certificate /etc/letsencrypt/live/badges.faithgram.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/badges.faithgram.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;
    client_max_body_size 8k;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }
}
